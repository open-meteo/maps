name: Tests & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      # Only the shared assets: grid-geometry (103M, served separately) must not
      # end up in the deployed build output.
      - name: Pull static assets
        run: npm run assets:pull -- shared
      - name: Linting
        run: npm run lint
      - name: Checks
        run: npm run check
      - name: Tests
        run: npm run test
      - name: Build
        run: npm run build
